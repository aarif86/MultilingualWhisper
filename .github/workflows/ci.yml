name: CI

# Fast feedback loop: builds for the Simulator (no signing needed at all) and runs
# unit tests on every push/PR. This is deliberately separate from release.yml,
# which needs real Apple signing secrets - that way you get a compile/test signal
# on every commit without having set up any Apple Developer secrets yet.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache whisper.xcframework
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: vendor/whisper.cpp/build-apple
          key: whisper-xcframework-${{ hashFiles('vendor/whisper.cpp/src/**', 'vendor/whisper.cpp/include/**', 'vendor/whisper.cpp/ggml/**', 'vendor/whisper.cpp/build-xcframework.sh') }}

      # whisper.cpp ships its own build script for exactly this - see
      # https://github.com/ggml-org/whisper.cpp/blob/master/examples/whisper.swiftui/README.md
      - name: Build whisper.xcframework
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          brew install cmake || true
          cd vendor/whisper.cpp
          chmod +x build-xcframework.sh
          ./build-xcframework.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('MultilingualWhisper/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-

      - name: Build for Simulator
        run: |
          xcodebuild build \
            -project MultilingualWhisper.xcodeproj \
            -scheme MultilingualWhisper \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Find an available iOS Simulator
        id: sim
        run: |
          set -euo pipefail
          NAME=$(xcrun simctl list devices available -j | jq -r '
            .devices | to_entries[] | .value[]
            | select(.isAvailable == true and (.name | test("iPhone")))
            | .name
          ' | head -n1)
          if [ -z "$NAME" ]; then
            echo "No available iPhone simulator found - listing everything for debugging:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project MultilingualWhisper.xcodeproj \
            -scheme MultilingualWhisper \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }},OS=latest" \
            CODE_SIGNING_ALLOWED=NO
