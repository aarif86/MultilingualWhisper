name: MultilingualWhisper
options:
  bundleIdPrefix: com.multilingualwhisper
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  MultilingualWhisper:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MultilingualWhisper
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: "Nasar Flow"
        NSMicrophoneUsageDescription: "Nasar Flow needs microphone access to record and transcribe your speech - entirely on-device, nothing leaves your phone."
        # Lets FlowSessionEngine's audio engine keep running while the app is
        # backgrounded - required for the keyboard's "Flow" session (activate
        # once, dictate repeatedly from the keyboard afterwards) to work at
        # all. A legitimate, Apple-documented background-mode use ("the app
        # records audio content while in the background"), not a workaround -
        # see FlowSessionEngine's doc comment for the part of this that's
        # still genuinely unverified (whether the engine has to be actively
        # running, vs merely "active", to actually keep the app alive).
        UIBackgroundModes:
          - audio
        # The "Flow is on" Live Activity (FlowLiveActivity) - drawn by the
        # NasarFlowWidgets extension, started/ended by FlowSessionEngine.
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        # Both reference build settings rather than hardcoding values, so
        # release.yml can bump CURRENT_PROJECT_VERSION per run (App Store
        # Connect rejects re-uploading a build number it's already seen) without
        # editing this file.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Lets the NasarFlowKeyboard extension launch the app to record (see
        # DictationHandoff.swift / NasarFlowKeyboard/) - a keyboard extension
        # can never access the microphone itself, Full Access or not.
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - nasarflow
            CFBundleURLName: com.multilingualwhisper.app
    # Re-enabled 2026-09-07: App Groups is now on both App IDs, and both
    # profiles ("Nasar Flow" regenerated, "Nasar Flow Keyboard" newly created)
    # grant it - see the matching embed:true re-enable on NasarFlowKeyboard
    # below, which must ship together with this (a signed archive fails
    # immediately if only one side of the pair is present).
    entitlements:
      path: Generated/MultilingualWhisper.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.multilingualwhisper.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.multilingualwhisper.app
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        # Tells Xcode which asset-catalog image set is the app icon, which is also
        # what makes it inject CFBundleIconName into the built Info.plist -
        # without this, App Store Connect rejects the upload for a "missing
        # CFBundleIconName" even if the icon images themselves are present.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Signing is intentionally left on Automatic here. ci.yml only ever builds
        # for the Simulator (no signing needed at all). release.yml overrides these
        # to manual signing with real values via xcodebuild -destination/-arguments,
        # not by editing this file - that keeps this project.yml usable by anyone
        # who forks the repo without touching Apple account details in two places.
        #
        # PROVISIONING_PROFILE_SPECIFIER is the one exception, baked in here rather
        # than passed on the command line: once there's a second target (the
        # keyboard extension) needing its OWN different profile, a single global
        # -PROVISIONING_PROFILE_SPECIFIER=X override on the archive command would
        # wrongly apply to both targets. Each target names its own profile here
        # instead, by the name it's expected to be created with in Apple's portal
        # (see README) - release.yml only needs to install both profiles, not know
        # which one belongs to which target.
        PROVISIONING_PROFILE_SPECIFIER: "Nasar Flow"
    dependencies:
      # whisper.xcframework is a dynamic framework (a real .dylib), not a static
      # one - confirmed the hard way, via a real TestFlight crash log: without
      # embed:true it links fine (build/archive both succeed) but crashes
      # instantly on launch on a real device with "DYLD 1 Library missing -
      # Library not loaded: @rpath/whisper.framework/whisper", because nothing
      # ever copies the actual dylib into the app bundle's Frameworks/ folder.
      - framework: vendor/whisper.cpp/build-apple/whisper.xcframework
        embed: true
      # Re-enabled 2026-09-07 alongside the main target's App Groups
      # entitlement above - both App IDs have App Groups now, and the
      # APPLE_KEYBOARD_PROVISIONING_PROFILE_BASE64 secret is set.
      - target: NasarFlowKeyboard
        embed: true
      # Live Activity, Lock Screen widget and Control Center controls - a third
      # bundle ID, App ID and profile ("Nasar Flow Widgets"); see README.
      - target: NasarFlowWidgets
        embed: true
    scheme:
      testTargets:
        - MultilingualWhisperTests
        - MultilingualWhisperUITests
      gatherCoverageData: true

  NasarFlowKeyboard:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NasarFlowKeyboard
      - path: MultilingualWhisper/Shared
    info:
      path: Generated/NasarFlowKeyboard.Info.plist
      properties:
        CFBundleDisplayName: "Nasar Flow"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            RequestsOpenAccess: true
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
    entitlements:
      path: Generated/NasarFlowKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.multilingualwhisper.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.multilingualwhisper.app.keyboard
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        # Same reasoning as the main target - see the comment on its
        # PROVISIONING_PROFILE_SPECIFIER above.
        PROVISIONING_PROFILE_SPECIFIER: "Nasar Flow Keyboard"

  NasarFlowWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NasarFlowWidgets
      - path: MultilingualWhisper/Shared
    info:
      path: Generated/NasarFlowWidgets.Info.plist
      properties:
        CFBundleDisplayName: "Nasar Flow"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Generated/NasarFlowWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.multilingualwhisper.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.multilingualwhisper.app.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        # Same reasoning as the main target - see the comment on its
        # PROVISIONING_PROFILE_SPECIFIER above.
        PROVISIONING_PROFILE_SPECIFIER: "Nasar Flow Widgets"

  MultilingualWhisperTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MultilingualWhisperTests
    dependencies:
      - target: MultilingualWhisper
    settings:
      base:
        SWIFT_VERSION: "5.0"

  # Simulator-driven UI tests (XCUITest) - launches the real built app in a
  # booted iOS Simulator and drives it via the accessibility tree, unlike
  # MultilingualWhisperTests above which never touches UI at all. Scoped
  # deliberately to launch/crash/navigation checks only - things like tapping
  # Record need mic-permission handling that's a real source of CI flakiness,
  # and every actual bug this app has shipped so far (GPU blocked in the
  # background, keyboard hand-off, backgrounding/suspension timing) needs real
  # hardware to reproduce anyway, which the Simulator doesn't enforce the same
  # way. This layer's job is narrower: catch "the app doesn't even launch"
  # (see the whisper.xcframework embed:true history above - that exact class
  # of bug) before a build ever reaches TestFlight.
  MultilingualWhisperUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MultilingualWhisperUITests
    dependencies:
      - target: MultilingualWhisper
    settings:
      base:
        SWIFT_VERSION: "5.0"
