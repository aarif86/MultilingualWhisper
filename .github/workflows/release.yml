name: Release to TestFlight

# Manual-only: needs a signing certificate, provisioning profile, and an App Store
# Connect API key configured as repo (or "release" environment) secrets before this
# can do anything. See README.md "TestFlight releases" for the exact secrets list
# and how to produce each base64 value.
#
# This has never been run against real Apple credentials from this codebase - it
# follows Apple's documented manual-signing CLI flow, but expect to debug at least
# one round of this against your own actual team/profile/Xcode version.

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Notes for yourself about this build (not sent anywhere)"
        required: false
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache whisper.xcframework
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: vendor/whisper.cpp/build-apple
          key: whisper-xcframework-${{ hashFiles('vendor/whisper.cpp/src/**', 'vendor/whisper.cpp/include/**', 'vendor/whisper.cpp/ggml/**', 'vendor/whisper.cpp/build-xcframework.sh') }}

      - name: Build whisper.xcframework
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          brew install cmake || true
          cd vendor/whisper.cpp
          chmod +x build-xcframework.sh
          ./build-xcframework.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Two profiles now: the main app and the NasarFlowKeyboard extension each
      # need their own (every extension has its own bundle ID, so needs its own
      # App ID + profile). Each target in project.yml bakes in its own expected
      # PROVISIONING_PROFILE_SPECIFIER by NAME - "Nasar Flow" and
      # "Nasar Flow Keyboard" respectively, matching exportOptions.plist - so
      # this step's only job is installing both profiles where Xcode can find
      # them by that name. No more dynamic UUID extraction/substitution: a
      # single global -PROVISIONING_PROFILE_SPECIFIER override on the archive
      # command would incorrectly apply to both targets, so each target names
      # its own profile in project.yml instead - see the comment there.
      - name: Import signing certificate and both provisioning profiles
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APP_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          KEYBOARD_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_KEYBOARD_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.CI_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/ci-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 -D -o "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo -n "$APP_PROVISION_PROFILE_BASE64" | base64 -D -o ~/Library/MobileDevice/Provisioning\ Profiles/app.mobileprovision
          echo -n "$KEYBOARD_PROVISION_PROFILE_BASE64" | base64 -D -o ~/Library/MobileDevice/Provisioning\ Profiles/keyboard.mobileprovision

      - name: Fill in exportOptions.plist
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: sed -i '' "s/__APPLE_TEAM_ID__/$TEAM_ID/" exportOptions.plist

      - name: Archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project MultilingualWhisper.xcodeproj \
            -scheme MultilingualWhisper \
            -configuration Release \
            -archivePath build/MultilingualWhisper.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            DEVELOPMENT_TEAM="$TEAM_ID"

      - name: Export .ipa
        run: |
          xcodebuild -exportArchive \
            -archivePath build/MultilingualWhisper.xcarchive \
            -exportPath build \
            -exportOptionsPlist exportOptions.plist

      # Deliberately NOT `-exportArchive ... -exportOptionsPlist` with
      # `destination: upload` - as of this writing that path only works with an
      # Apple ID interactively signed into Xcode, not App Store Connect API-key
      # auth, which is the only kind of auth that works headlessly in CI. So:
      # export a plain .ipa above, then upload it separately here.
      - name: Upload to TestFlight
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$APPLE_API_KEY_BASE64" | base64 -D -o ~/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8

          IPA_PATH=$(find build -maxdepth 1 -name '*.ipa' | head -n1)
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APPLE_API_KEY_ID" \
            --apiIssuer "$APPLE_API_ISSUER_ID"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MultilingualWhisper-release-build
          path: |
            build/*.ipa
            build/MultilingualWhisper.xcarchive/dSYMs
          if-no-files-found: ignore

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/ci-signing.keychain-db" || true
