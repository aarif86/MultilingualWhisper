name: MultilingualWhisper
options:
  bundleIdPrefix: com.multilingualwhisper
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  MultilingualWhisper:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MultilingualWhisper
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: "Nasar Flow"
        NSMicrophoneUsageDescription: "Nasar Flow needs microphone access to record and transcribe your speech - entirely on-device, nothing leaves your phone."
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.multilingualwhisper.app
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        # Tells Xcode which asset-catalog image set is the app icon, which is also
        # what makes it inject CFBundleIconName into the built Info.plist -
        # without this, App Store Connect rejects the upload for a "missing
        # CFBundleIconName" even if the icon images themselves are present.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Signing is intentionally left on Automatic here. ci.yml only ever builds
        # for the Simulator (no signing needed at all). release.yml overrides these
        # to manual signing with real values via xcodebuild -destination/-arguments,
        # not by editing this file - that keeps this project.yml usable by anyone
        # who forks the repo without touching Apple account details in two places.
    dependencies:
      - framework: vendor/whisper.cpp/build-apple/whisper.xcframework
        embed: false
    scheme:
      testTargets:
        - MultilingualWhisperTests
      gatherCoverageData: true

  MultilingualWhisperTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MultilingualWhisperTests
    dependencies:
      - target: MultilingualWhisper
    settings:
      base:
        SWIFT_VERSION: "5.0"
