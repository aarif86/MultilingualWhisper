name: CI

# Fast feedback loop: builds for the Simulator (no signing needed at all) and runs
# unit tests on every push/PR. This is deliberately separate from release.yml,
# which needs real Apple signing secrets - that way you get a compile/test signal
# on every commit without having set up any Apple Developer secrets yet.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache whisper.xcframework
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: vendor/whisper.cpp/build-apple
          key: whisper-xcframework-${{ hashFiles('vendor/whisper.cpp/src/**', 'vendor/whisper.cpp/include/**', 'vendor/whisper.cpp/ggml/**', 'vendor/whisper.cpp/build-xcframework.sh') }}

      # whisper.cpp ships its own build script for exactly this - see
      # https://github.com/ggml-org/whisper.cpp/blob/master/examples/whisper.swiftui/README.md
      - name: Build whisper.xcframework
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          brew install cmake || true
          cd vendor/whisper.cpp
          chmod +x build-xcframework.sh
          ./build-xcframework.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('MultilingualWhisper/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-

      - name: Build for Simulator
        run: |
          xcodebuild build \
            -project MultilingualWhisper.xcodeproj \
            -scheme MultilingualWhisper \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      # NOTE: "iPhone 16" is a best guess at a simulator name that will still exist
      # on whatever Xcode version this runner defaults to. If this step fails with
      # "unable to find a device matching", run `xcrun simctl list devicetypes` in
      # a debug step and swap in a name that's actually available.
      - name: Run unit tests
        run: |
          xcodebuild test \
            -project MultilingualWhisper.xcodeproj \
            -scheme MultilingualWhisper \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGNING_ALLOWED=NO
