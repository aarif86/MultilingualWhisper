name: MultilingualWhisper
options:
  bundleIdPrefix: com.multilingualwhisper
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  MultilingualWhisper:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MultilingualWhisper
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: "Nasar Flow"
        NSMicrophoneUsageDescription: "Nasar Flow needs microphone access to record and transcribe your speech - entirely on-device, nothing leaves your phone."
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        # Both reference build settings rather than hardcoding values, so
        # release.yml can bump CURRENT_PROJECT_VERSION per run (App Store
        # Connect rejects re-uploading a build number it's already seen) without
        # editing this file.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.multilingualwhisper.app
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        # Tells Xcode which asset-catalog image set is the app icon, which is also
        # what makes it inject CFBundleIconName into the built Info.plist -
        # without this, App Store Connect rejects the upload for a "missing
        # CFBundleIconName" even if the icon images themselves are present.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Signing is intentionally left on Automatic here. ci.yml only ever builds
        # for the Simulator (no signing needed at all). release.yml overrides these
        # to manual signing with real values via xcodebuild -destination/-arguments,
        # not by editing this file - that keeps this project.yml usable by anyone
        # who forks the repo without touching Apple account details in two places.
    dependencies:
      # whisper.xcframework is a dynamic framework (a real .dylib), not a static
      # one - confirmed the hard way, via a real TestFlight crash log: without
      # embed:true it links fine (build/archive both succeed) but crashes
      # instantly on launch on a real device with "DYLD 1 Library missing -
      # Library not loaded: @rpath/whisper.framework/whisper", because nothing
      # ever copies the actual dylib into the app bundle's Frameworks/ folder.
      - framework: vendor/whisper.cpp/build-apple/whisper.xcframework
        embed: true
    scheme:
      testTargets:
        - MultilingualWhisperTests
      gatherCoverageData: true

  MultilingualWhisperTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MultilingualWhisperTests
    dependencies:
      - target: MultilingualWhisper
    settings:
      base:
        SWIFT_VERSION: "5.0"
